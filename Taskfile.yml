version: '3'

# Tasks in this file intentionally operate only on components present in this
# checkout. Hooks and site tasks should be added when their directories land.
#
# The plane:* tasks drive the SchemaForge control plane in schemas/ and
# policies/. They need the `schemaforge` CLI on PATH.

tasks:
  default:
    desc: List available development tasks
    cmds:
      - task --list

  dev:
    desc: Start the currently implemented Garrison agent daemon
    cmds:
      - task: agent

  agent:
    desc: Run garrison-agent as an ACP daemon on its configured Unix socket
    cmds:
      - cargo run -p garrison-agent -- serve

  acp:
    desc: Run garrison-agent in editor-spawned ACP stdio mode
    cmds:
      - cargo run -p garrison-agent -- acp

  ping:
    desc: Handshake with the running ACP daemon and print its status
    cmds:
      - cargo run -p garrison-agent -- ping

  test:
    desc: Run the Rust workspace test suite
    cmds:
      - cargo test --workspace

  check:
    desc: Type-check the Rust workspace
    cmds:
      - cargo check --workspace

  fmt:
    desc: Check Rust formatting without changing files
    cmds:
      - cargo fmt --all -- --check

  extension:install:
    desc: Install the VS Code extension's development dependencies
    dir: extensions/vscode
    cmds:
      - npm install

  extension:check:
    desc: Type-check the VS Code extension
    dir: extensions/vscode
    cmds:
      - npm run check

  extension:package:
    desc: Build a VSIX package for the VS Code extension
    dir: extensions/vscode
    cmds:
      - npm run package

  jetbrains:build:
    desc: Compile and package the JetBrains extension
    dir: extensions/jetbrains
    cmds:
      - ./gradlew buildPlugin

  jetbrains:verify:
    desc: Validate the JetBrains plugin project and archive structure
    dir: extensions/jetbrains
    cmds:
      - ./gradlew verifyPluginProjectConfiguration verifyPluginStructure

  jetbrains:run:
    desc: Launch a development IDE with the Garrison plugin installed
    dir: extensions/jetbrains
    cmds:
      - ./gradlew runIde

  # --- Control plane -------------------------------------------------------

  plane:parse:
    desc: Parse and validate the control-plane .schema files
    cmds:
      - schemaforge parse schemas

  plane:policies:
    desc: Strict-mode validate the Cedar bundle (generated + custom) and role ranks
    cmds:
      - schemaforge policies validate schemas --custom-dir policies/custom --role-ranks policies/role_ranks.toml

  plane:check:
    desc: Run every control-plane gate that needs no database
    cmds:
      - task: plane:parse
      - task: plane:policies

  plane:key:
    desc: Mint the control plane's PASETO v4 symmetric key into keys/ (gitignored)
    cmds:
      - schemaforge token init-key --output ./keys/paseto.key

  plane:plan:
    desc: Show the migration plan for the control plane without executing it
    cmds:
      - schemaforge apply schemas --dry-run

  plane:apply:
    desc: Apply the control-plane schemas and generate their Cedar policies
    # --force because every `unique` field lands as an AddUnique step, which the
    # migration planner classifies requires_confirmation: the DDL fails against
    # existing duplicate rows. On an empty database there is nothing to clean.
    cmds:
      - schemaforge apply schemas --with-policies --force

  plane:serve:
    desc: Serve the control-plane REST API and admin surface
    cmds:
      - schemaforge serve --schemas schemas

  plane:openapi:
    desc: Export the control plane's OpenAPI specification
    cmds:
      - schemaforge export openapi schemas -o control-plane.openapi.json
