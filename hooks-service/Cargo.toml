[package]
name = "garrison-hooks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acton-reactive = "9.2.1"
# The hook service runs on the same platform layer as the forge that calls it.
# This is what supplies token authentication, mutual-TLS caller authorization,
# tracing, and the health surface — see `src/main.rs`. Do not replace it with a
# bare `tonic::transport::Server`: nothing would authenticate the caller.
acton-service = { version = "0.39", features = ["auth", "grpc", "tls"] }
acton-service-client = "0.1.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
garrison-wire = { version = "0.1.0", path = "../wire" }
prost = "0.14"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
garrison-wire = { path = "../wire", features = ["testing"] }
tempfile = "3.27.0"
testcontainers = "0.28.0"
toml = "1.1.4"
