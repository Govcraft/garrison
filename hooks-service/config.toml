# Configuration for the hooks_service hook service.
#
# Loaded by `Config::load()` in src/main.rs from this file, then from
# $XDG_CONFIG_HOME and /etc. `ACTON_*` environment variables override it.

[service]
name = "garrison-hooks"
# 0.0.0.0 is safe here only because the surface below is authenticated.
# Narrow it to the interface the forge reaches you on if you can.
bind = "0.0.0.0"
port = 9391

[grpc]
enabled = true
# false multiplexes gRPC onto the HTTP port above, which is what the forge
# dials. Set true only if you also want a separate gRPC listener.
use_separate_port = false

# Token authentication. acton-service applies this to every registered gRPC
# service automatically; removing this section removes that, and the RPCs go
# on working unauthenticated.
#
# `key_path` must be the same PASETO key the forge signs with, since the
# credential on an inbound hook call is minted by the forge. Copy the path
# from the forge's own `[token]` section.
[token]
format = "paseto"
# Development: the plane's own key, since it mints the credential on
# inbound hook calls. In a deployment this is a copy of that key at a
# path only this service can read.
key_path = "../keys/paseto.key"

# Mutual-TLS caller authorization. Uncomment to require that the caller
# present a certificate whose subjectAltName is on the allowlist, in addition
# to a valid token. A private CA authenticates every workload it has ever
# issued to; this is what narrows that to the forge.
#
# [tls]
# enabled = true
# cert_path = "/etc/hooks_service/tls/server.crt"
# key_path = "/etc/hooks_service/tls/server.key"
# client_ca_path = "/etc/hooks_service/tls/ca.crt"
#
# [caller_auth]
# mode = "mtls"
# allowlist = ["schema-forge.internal"]

# ---------------------------------------------------------------------------
# How this service reaches the control plane.
#
# It calls the plane's REST API rather than its database, so every row it
# creates goes through the same Cedar decision and the same `@require` rules as
# a row a human creates.
#
# `token` is a bearer carrying two service roles and nothing else:
# `enrollment_service` (provision an accepted enrollment, assemble a bundle
# for the publish gate) and `audit_service` (the only writer of AuditChain).
# Keep it out of this file in any real deployment: `ACTON_GARRISON_TOKEN`
# overrides it, and the framework's env layering makes that work with no code
# here. Every field here is one word because that layering splits on `_`; see
# src/config.rs.
#
# Mint one with (the tenant chain is required; see docs/control-plane.md):
#   schemaforge token generate --sub garrison-hooks \
#     --issuer garrison-control-plane --roles enrollment_service,audit_service \
#     --lifetime 2592000 --tenant-chain "$CHAIN"
[garrison]
url   = "http://127.0.0.1:3000"
token = ""

# The `iss` an enrollment artifact must carry, checked against the issuer
# recorded on the EnrollmentToken row.
#
# This must match the plane's own `[token] issuer`, and that is a constraint
# rather than a preference. acton-service validates every bearer against the
# single issuer in its `[token]` section, so an artifact minted under some
# other issuer is a 401 at authentication and never reaches this service. A
# value here that the plane would not itself accept refuses every artifact
# that can actually arrive.
#
# Separating enrollment artifacts from console bearers by `iss` therefore
# needs the plane to accept more than one issuer, which it does not today.
# The separation that does hold is the `enrollee` role, which is granted write
# on Redemption and nothing else anywhere in the bundle.
issuer = "garrison-control-plane"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The directory: Entra ID as the authority for who may hold a machine.
#
# With `mode = "off"` (the default) operators are hand-typed rows and nothing
# ever deprovisions them; the service logs a warning at boot to say so. With
# any other mode a supervised actor lists the directory every `interval`
# seconds and makes the plane's Operator rows agree with it, under these
# rules (docs/control-plane.md, "Directory"):
#
#   R1  The join key is `entra_object_id`. A member with no row is created
#       `active`; a row whose member is absent is `offboarded`.
#   R2  A hand-typed row with no object id is linked once, by case-insensitive
#       UPN match. After that the UPN is a directory-owned attribute: a rename
#       patches the same row, so every install, session, and audit entry keeps
#       pointing at the same person.
#   R3  A disabled account is `suspended`; the seat is revoked with the reason
#       "directory: account disabled" (removed: "directory: account removed")
#       and the console login is deactivated. `platform_admin` is never
#       deactivated by the sync.
#   R4  Enrollment refuses an operator who is not `active`, and, while the
#       directory is on, one with no `entra_object_id` or whose organization
#       has not synced successfully within `staleness` seconds.
#   R5  An empty listing is a failure, never "everyone left". A listing that
#       would suspend or offboard more than `fraction` of the active operators
#       is refused whole and recorded on the Organization as `failed`.
#   R6  An unreachable directory or plane fails the tick; the next one retries.
#   R7  Enrollment carries no directory identity: the machine reports a UPN
#       once, the plane resolves it to a row, and the row's object id is the
#       identity from then on.
#
# `mode = "file"` reads a JSON array of members from `path` on every tick:
#   [{"object_id": "...", "upn": "...", "display_name": "...",
#     "mail": "...", "enabled": true}]
# It exists for tests and for a deployment that already exports its
# directory; edit the file and the next tick picks it up.
#
# `mode = "graph"` lists Microsoft Graph with an app registration holding
# `User.Read.All` and `GroupMember.Read.All` (application permissions,
# admin-consented). The tenant comes from each Organization's
# `entra_tenant_id`; the group from its `entra_group_id`, or every user in
# the tenant when that is blank. Graph has been exercised against recorded
# responses only; see docs/control-plane.md for what a real tenant must
# still confirm.
#
# `token` is a plane bearer for the `directory_service` role, distinct from
# `[garrison] token`, so the sync cannot spend the enrollment grant and the
# hook cannot spend the sync's. `ACTON_DIRECTORY_TOKEN` and
# `ACTON_DIRECTORY_SECRET` override the two secrets. Mint the bearer with:
#   schemaforge token generate --sub garrison-directory \
#     --issuer garrison-control-plane --roles directory_service \
#     --lifetime 2592000 --tenant-chain "$CHAIN"
[directory]
mode = "off"
token = ""
# The Organization row this reconciler serves, by id. The bearer is scoped to
# that tenant and the plane does not list tenant-root rows to a tenant-scoped
# bearer, so it is named here rather than discovered. One hooks service
# reconciles one organization.
organization = ""
# Seconds between listings, and how old the last successful sync may be
# before enrollment is refused (R4). `staleness` must be at least `interval`.
interval  = 300
staleness = 900
# The largest share of active operators one tick may suspend or offboard.
fraction = 0.5
# mode = "file"
# path = "/etc/garrison/directory.json"
# mode = "graph"
# client    = "00000000-0000-0000-0000-000000000000"
# secret    = ""
# authority = "https://login.microsoftonline.com"
# graph     = "https://graph.microsoft.com/v1.0"
# ---------------------------------------------------------------------------
