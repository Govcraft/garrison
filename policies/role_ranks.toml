# Garrison control plane — role hierarchy.
#
# Ranks drive the no-upward-visibility rule for user management and for any
# Cedar policy that compares `principal.role_rank` against `resource.role_rank`:
# a principal may manage or see another user only when its own rank is at least
# the target's. `platform_admin` is reserved at i64::MAX and must not appear
# here; it is the SchemaForge operator role, not a Garrison role.
#
# The ordering below is the boundary's chain of authority, not a convenience:
#   org_admin        runs the deployment — seats, teams, installs, retirement
#   security_officer authors and publishes policy bundles and endpoint approvals
#   auditor          reads the audit trail and chain verification, writes nothing
#   team_lead        sees their team's operators, installs, and sessions
#   operator         a developer's agent: pulls policy, appends audit, nothing more

[roles]
org_admin        = 1000
security_officer = 800
auditor          = 600
team_lead        = 400
operator         = 100

# The enrollment artifact's only role. Ranked below every human role: a
# daemon that has not yet enrolled outranks nobody, and role_rank drives the
# no-upward-visibility rule.
enrollee         = 10

# The hook service that provisions an accepted enrollment. Ranked at the very
# bottom deliberately: role_rank gates visibility of *user* records, and a
# machine-provisioning service must never see one. Its actual authority comes
# from the @access lists that name it — AgentInstall, InstallCredential and
# EnrollmentToken writes, Operator reads — and nothing else.
enrollment_service = 20

# The hook service's second hat: the verifying ingest for shipped audit
# entries. Same reasoning as enrollment_service, same rank. It is the only
# writer of AuditChain, so an install's bearer can report a trail but never
# assert what the plane verified. One bearer carries both service roles:
#   --roles enrollment_service,audit_service
audit_service    = 20

# The directory reconciler: projects Entra ID group membership onto Operator
# and Seat rows and the console User. Ranked above the other services only so
# it may not be managed by them, and still below every human role. Its
# authority is the @access lists that name it and the @field_access fences
# that keep it from rebinding an organization or promoting a user.
directory_service = 30
