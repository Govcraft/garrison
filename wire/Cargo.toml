[package]
name = "garrison-wire"
version = "1.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acton-ai = { version = "=0.37.0", default-features = false }
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Exposes the vector's signing key so the two ends of this wire can
# produce assertions in their own tests without a second signing helper.
# Never enable it for a shipped binary.
testing = []
