[package]
name = "garrison-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acton-ai = { version = "0.33.0", path = "../../acton-ai" }
acton-reactive = "9.1.0"
agent-client-protocol-schema = "1.6.0"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
getrandom = "0.4.3"
lsp-types = "0.97.0"
mti = "1.1.1"
ratatui = { version = "0.30.2", features = ["scrolling-regions", "unstable-widget-ref"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
textwrap = "0.16.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
vt100 = "0.16.2"
