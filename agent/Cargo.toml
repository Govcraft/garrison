[package]
name = "garrison-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acton-ai = { version = "0.32.0", path = "../../acton-ai" }
acton-reactive = "9.1.0"
agent-client-protocol-schema = "1.6.0"
clap = { version = "4.6.6", features = ["derive"] }
mti = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
