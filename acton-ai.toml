# acton-ai configuration for garrison-agent.
#
# The default provider is `claude`; point default_provider at "openai" to
# use GPT models, or at "ollama" to run fully local. The cloud providers
# authenticate with keys stored by `garrison-agent login <provider>`; swap
# the ollama `model` for any tool-calling model `ollama list` shows.

default_provider = "claude"

[providers.claude]
type = "anthropic"
model = "claude-sonnet-5"
api_key_file = "~/.config/garrison/anthropic-key"
timeout_secs = 600
max_tokens = 8192
context_window_tokens = 200000

[providers.openai]
type = "openai"
model = "gpt-5.6-terra"
api_key_file = "~/.config/garrison/openai-key"
timeout_secs = 600
max_tokens = 8192
# Conservative; raise if the model's real window is larger.
context_window_tokens = 200000

[providers.ollama]
type = "ollama"
model = "qwen3.8"
base_url = "http://127.0.0.1:11434/v1"
timeout_secs = 600
context_window_tokens = 32768

[providers.ollama.rate_limit]
requests_per_minute = 1000
tokens_per_minute = 1000000

[defaults]
max_tool_rounds = 25
