# acton-ai configuration for garrison-agent.
#
# The default provider is `groq` (fast hosted gpt-oss-120b); point
# default_provider at "claude"/"openai" for the frontier clouds or "ollama"
# to run fully local. The cloud providers authenticate with keys stored by
# `garrison-agent login <provider>`; the groq key file was placed by hand.

default_provider = "groq"

[providers.claude]
type = "anthropic"
model = "claude-sonnet-5"
api_key_file = "~/.config/garrison/anthropic-key"
timeout_secs = 600
max_tokens = 8192
context_window_tokens = 200000

[providers.openai]
type = "openai"
model = "gpt-5.6-terra"
api_key_file = "~/.config/garrison/openai-key"
timeout_secs = 600
max_tokens = 8192
# Conservative; raise if the model's real window is larger.
context_window_tokens = 200000

[providers.groq]
type = "groq"
model = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
api_key_file = "~/.config/garrison/groq-key"
timeout_secs = 600
max_tokens = 8192
context_window_tokens = 131072

[providers.ollama]
type = "ollama"
model = "qwen3.8"
base_url = "http://127.0.0.1:11434/v1"
timeout_secs = 600
context_window_tokens = 32768

[providers.ollama.rate_limit]
requests_per_minute = 1000
tokens_per_minute = 1000000

[context]
# Truncation must never drop the system prompt; KeepRecent (the default)
# keeps only a recent tail and would.
strategy = "keep-system-and-recent"

[defaults]
max_tool_rounds = 25
