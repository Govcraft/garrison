# acton-ai configuration for garrison-agent.
#
# The default provider is `kimi` (Moonshot's kimi-k3, 1M context); point
# default_provider at "claude"/"openai" for the frontier clouds or "ollama"
# to run fully local. The cloud providers authenticate with keys stored by
# `garrison-agent login <provider>`; the kimi key file was placed by hand at
# ~/.config/garrison/kimi-key, mode 0600.

default_provider = "kimi"

[providers.claude]
type = "anthropic"
model = "claude-sonnet-5"
api_key_file = "~/.config/garrison/anthropic-key"
timeout_secs = 600
max_tokens = 8192
context_window_tokens = 200000

[providers.openai]
type = "openai"
model = "gpt-5.6-terra"
api_key_file = "~/.config/garrison/openai-key"
timeout_secs = 600
max_tokens = 8192
# Conservative; raise if the model's real window is larger.
context_window_tokens = 200000

# Moonshot's kimi-k3, spoken to over its OpenAI-compatible endpoint. The type
# is not one acton-ai knows by name, which is deliberate: an unrecognized type
# with a base_url is treated as OpenAI-compatible, and that is exactly what
# this is.
[providers.kimi]
type = "kimi"
model = "kimi-k3"
base_url = "https://api.moonshot.ai/v1"
api_key_file = "~/.config/garrison/kimi-key"
timeout_secs = 600
# Larger than the other providers' 8192 on purpose. K3 always reasons — the
# thinking cannot be switched off, only dialed down — and its reasoning tokens
# are billed and counted against this same completion budget. At 8192 a long
# deliberation would eat the whole allowance and truncate the tool call it was
# deliberating about.
max_tokens = 32768
context_window_tokens = 1000000

# The account's cumulative top-up ($20) puts it in Moonshot's Tier 2 (500 RPM,
# 3M TPM). These are Tier 1's numbers, held one tier low so the local limiter
# queues rather than discovering the ceiling as a 429 mid-turn. Raise them
# after topping up further; see platform.kimi.ai/docs/pricing/limits.
[providers.kimi.rate_limit]
requests_per_minute = 200
tokens_per_minute = 2000000

[providers.ollama]
type = "ollama"
model = "qwen3.8"
base_url = "http://127.0.0.1:11434/v1"
timeout_secs = 600
context_window_tokens = 32768

[providers.ollama.rate_limit]
requests_per_minute = 1000
tokens_per_minute = 1000000

[context]
# Truncation must never drop the system prompt; KeepRecent (the default)
# keeps only a recent tail and would.
strategy = "keep-system-and-recent"

[defaults]
max_tool_rounds = 25

# Tool calls that write — bash, write_file, edit_file — run in a re-exec'd
# child of this binary rather than in the daemon's own process. `best-effort`
# applies landlock and seccomp where the kernel offers them and warns where it
# does not; a deployment that must not run unconfined sets `enforce`, which
# refuses to start the child instead.
[sandbox]
hardening = "best-effort"

[sandbox.limits]
max_execution_ms = 120000
max_memory_mb = 1024

# The hardened child's landlock ruleset covers the system directories, the
# per-call TMPDIR and the session root. Everything installed under this
# user's home is outside it, so a `uv` on PATH would be found by the shell
# and then refused by the kernel as a bare "Permission denied". These are
# the directories uv actually needs: itself and the interpreters it manages
# to read and execute, its cache to write.
[sandbox.paths]
read_exec = ["~/.local/bin", "~/.local/share/uv"]
read_write = ["~/.cache/uv"]

# The tamper-evident invocation trail. The section's presence arms it: every
# tool call is appended as a hash-chained JSONL entry recording the gate's
# verdict (approved, and by whom) alongside the outcome, so refusals are on
# the record exactly as successes are. `acton-ai audit verify` walks the chain.
#
# Kept inside the checkout during development so the trail travels with the
# work; a deployment points this at a durable path outside the project tree.
[audit]
path = ".garrison/audit.jsonl"
